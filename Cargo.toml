[workspace]
resolver = "3"
members = ["crates/*", "xtask"]
default-members = ["crates/*"]

[workspace.dependencies]
insta = "1.49.0"
serde_core = { version = "1", default-features = false }
serde_json = { version = "1", default-features = false }
taba-rolldown = { path = "crates/taba-rolldown", version = "0.0.0" }
tokio = { version = "1.53.3", features = ["rt"] }

[workspace.lints.rust]
missing_debug_implementations = "warn"
missing_docs = "warn"
unreachable_pub = "warn"
unsafe_code = "forbid"

[workspace.lints.rustdoc]
broken_intra_doc_links = "deny"

[workspace.package]
version = "0.0.0" # sync public facing crates only
rust-version = "1.95"
edition = "2024"
license = "Apache-2.0 OR MIT"
authors = ["Chip Reed <chip@chip.sh>"]
repository = "https://github.com/taba-build/taba"
readme = "README.md"
